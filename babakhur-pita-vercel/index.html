<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাবাখুর পিডা</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--road:#555;--accent:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#f1efe9;--road:#2c2e33;--accent:#ff6b5b}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#f1efe9;--road:#2c2e33;--accent:#ff6b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:4px 0;font-size:1.7rem;color:var(--accent)}
.hud{display:flex;gap:14px;font-size:1.05rem;margin:4px 0;flex-wrap:wrap;justify-content:center}
#wrap{position:relative;width:100%;max-width:800px}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation;background:var(--road)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.82);color:#fff;border-radius:12px;padding:12px;overflow:auto}
#ov h2{margin:0 0 6px;font-size:1.6rem}
#ov p{margin:3px 0;max-width:480px;line-height:1.45;font-size:.95rem}
input{font:inherit;font-size:1.05rem;padding:9px 14px;border-radius:999px;border:2px solid #888;width:min(260px,80%);text-align:center;margin-top:8px}
button{margin-top:10px;font:inherit;font-size:1.05rem;padding:9px 26px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
#lb{margin-top:8px;width:min(340px,92%);text-align:left;font-size:.95rem}
#lb h3{margin:0 0 4px;text-align:center;font-size:1.05rem}
#lb ol{margin:0;padding-left:1.6em;max-height:150px;overflow:auto}
#lb li{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
#lb li.me{color:#ffd54a;font-weight:700}
.note{font-size:.8rem;opacity:.75}
</style>
</head>
<body>
<h1>🧔 বাবাখুর পিডা</h1>
<div class="hud"><span>খেলোয়াড়: <b id="u">-</b></span><span>স্কোর: <b id="s">0</b></span><span>জীবন: <b id="l">❤️❤️❤️</b></span><span>সেরা: <b id="b">0</b></span></div>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<div id="ov"></div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=800,H=450,ov=document.getElementById('ov');
const lanes=[190,260,330];
let ents=[],fx=[],score=0,lives=3,t=0,spawn=0,run=false,best=0,last=0,name='',uid=null,db=null,rows=[],unsub=null,lastSay=0;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
name=LS.get('bp_name')||'';best=+LS.get('bp_best')||0;

/* ---------- sound ---------- */
let ac=null;
function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(text,pitch,rate){
  try{
    const s=window.speechSynthesis;if(!s)return;
    const now=performance.now();if(now-lastSay<350)return;lastSay=now;
    s.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';
    const v=s.getVoices().find(v=>/^bn/i.test(v.lang));if(v)u.voice=v;
    u.pitch=pitch;u.rate=rate;u.volume=1;s.speak(u);
  }catch(e){}
}
function sndHitBad(){tone(180,.12,'sawtooth',.2,60);say('মাইরা ফালাইলো রে!',.6,1.05)}
function sndCaught(){tone(520,.1,'square',.12);setTimeout(()=>tone(780,.15,'square',.12),90)}
function sndHitCivil(){tone(300,.25,'triangle',.25,90);say('শুধু আমার উপরেই! কেন? কেন?',1.5,.95)}
function sndEscape(){tone(200,.3,'sine',.15,80)}

/* ---------- leaderboard ---------- */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function lbHTML(){
  if(!rows.length)return '<div id="lb"><h3>🏆 লিডারবোর্ড</h3><p class="note" style="text-align:center">এখনো কেউ খেলেনি</p></div>';
  return '<div id="lb"><h3>🏆 লিডারবোর্ড</h3><ol>'+rows.map(r=>'<li class="'+(r.id===uid||(!uid&&r.name===name)?'me':'')+'"><span>'+esc(r.name)+'</span><b>'+r.score+'</b></li>').join('')+'</ol></div>';
}
function localRows(){try{return JSON.parse(LS.get('bp_local')||'[]')}catch(e){return[]}}
function refreshLB(){const el=document.getElementById('lb');if(el)el.outerHTML=lbHTML()}
async function fetchRows(){
  try{const r=await fetch('/api/leaderboard');if(!r.ok)throw 0;rows=(await r.json()).rows}
  catch(e){rows=localRows()}
  refreshLB();
}
function initDb(){fetchRows();setInterval(()=>{if(ov.style.display!=='none')fetchRows()},15000)}
async function submit(){
  if(score>best){best=score;LS.set('bp_best',best)}
  const lr=localRows();const mine=lr.find(r=>r.name===name);
  if(mine){if(score>mine.score)mine.score=score}else lr.push({name,score});
  lr.sort((a,b)=>b.score-a.score);LS.set('bp_local',JSON.stringify(lr.slice(0,10)));
  try{await fetch('/api/leaderboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score})})}catch(e){}
  await fetchRows();hud();
}

/* ---------- screens ---------- */
function hud(){document.getElementById('u').textContent=name||'-';document.getElementById('s').textContent=score;document.getElementById('l').textContent='❤️'.repeat(Math.max(lives,0))||'💀';document.getElementById('b').textContent=best}
function home(msg){
  ov.style.display='flex';
  ov.innerHTML='<h2>'+(msg||'বাবাখুর পিডা')+'</h2>'+(msg?'':'<p>রাস্তায় ইয়াবা বিক্রেতা (💊) ঘুরছে! ট্যাপ/ক্লিক করে ২ বার আঘাত করো, ধরা পড়লে তারা থানায় (🚓) যাবে।</p><p>⚠️ নিরীহ মানুষকে মারলে বা বিক্রেতা পালালে ১টা জীবন যাবে!</p>')
   +'<input id="nm" maxlength="16" placeholder="তোমার ইউজারনেম" value="'+esc(name)+'" autocomplete="off">'
   +'<button id="go">'+(msg?'আবার খেলো':'খেলা শুরু')+'</button>'+lbHTML()+'<p class="note">🔊 সাউন্ড অন রাখো</p>';
  document.getElementById('go').onclick=()=>{const v=document.getElementById('nm').value.trim();if(!v){document.getElementById('nm').focus();return}name=v;LS.set('bp_name',name);start()};
}
function start(){ents=[];fx=[];score=0;lives=3;t=0;spawn=0;run=true;ov.style.display='none';hud();tone(440,.05,'square',.01);try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}last=performance.now();requestAnimationFrame(loop)}
async function end(){run=false;await submit();home('খেলা শেষ 💀 স্কোর: '+score)}

/* ---------- game ---------- */
function add(){
  const fromL=Math.random()<.5,sp=1.3+Math.min(score/120,2.2)+Math.random();
  ents.push({x:fromL?-30:W-110,y:lanes[Math.floor(Math.random()*3)],vx:(fromL?1:-1)*sp,bad:Math.random()<.7,hp:2,st:'walk',bob:Math.random()*6});
}
function loop(n){
  if(!run)return;
  const dt=Math.min((n-last)/16.7,3);last=n;t+=dt;spawn-=dt;
  if(spawn<=0){add();spawn=Math.max(30,80-score/3)}
  for(const e of ents){
    if(e.st==='caught'){const dx=W-70-e.x;e.x+=Math.sign(dx)*3.5*dt;e.y+=(260-e.y)*.05*dt;if(Math.abs(dx)<6){e.st='done';score+=10;hud();sndCaught();fx.push({x:W-120,y:240,t:50,s:'+১০ 🚔'})}}
    else e.x+=e.vx*dt;
    e.bob+=.15*dt;
    if(e.st==='walk'&&(e.x<-80||e.x>W+10)){if(e.bad){lives--;hud();sndEscape();fx.push({x:Math.min(Math.max(e.x,20),W-100),y:e.y,t:50,s:'পালিয়েছে! 💨'})}e.st='done'}
  }
  ents=ents.filter(e=>e.st!=='done');
  fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
  draw();
  if(lives<=0){end();return}
  requestAnimationFrame(loop);
}
function draw(){
  x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--road').trim()||'#555';x.fillRect(0,0,W,H);
  x.fillStyle='#6fa86f';x.fillRect(0,0,W,140);x.fillStyle='#8a8a8a';x.fillRect(0,140,W,10);
  x.font='34px serif';x.textBaseline='middle';
  for(let i=0;i<8;i++)x.fillText(i%2?'🌳':'🏠',20+i*105,100);
  x.strokeStyle='#ddd';x.lineWidth=3;x.setLineDash([24,18]);
  [225,295].forEach(y=>{x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()});x.setLineDash([]);
  x.font='54px serif';x.fillText('🚓',W-90,250);
  x.font='14px sans-serif';x.fillStyle='#fff';x.fillText('থানা',W-78,290);
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){
    x.font='44px serif';x.fillText(e.bad?'🕴️':'🚶',e.x,e.y+Math.sin(e.bob)*3);
    if(e.bad){x.font='20px serif';x.fillText(e.st==='caught'?'🔗':'💊',e.x+14,e.y-34);if(e.st==='walk'&&e.hp===1)x.fillText('🤕',e.x+34,e.y-20)}
  }
  for(const f of fx){x.globalAlpha=Math.min(1,f.t/25);x.font='bold 20px sans-serif';x.fillStyle='#fff';x.fillText(f.s,f.x,f.y-(50-f.t));x.globalAlpha=1}
}
function hit(ev){
  if(!run)return;
  const r=cv.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width,py=(ev.clientY-r.top)*H/r.height;
  let b=null,bd=1e9;
  for(const e of ents){if(e.st!=='walk')continue;const d=Math.hypot(px-(e.x+20),py-e.y);if(d<42&&d<bd){bd=d;b=e}}
  if(!b){fx.push({x:px-10,y:py,t:25,s:'💥'});return}
  if(b.bad){b.hp--;sndHitBad();fx.push({x:b.x,y:b.y-30,t:30,s:'💥 মাইরা ফালাইলো রে!'});
    if(b.hp<=0){b.st='caught';fx.push({x:b.x,y:b.y-50,t:40,s:'ধরা পড়েছে! 🔗'})}}
  else{lives--;hud();b.st='done';sndHitCivil();fx.push({x:b.x,y:b.y-30,t:60,s:'শুধু আমার উপরেই! কেন? কেন? ❌'})}
}
cv.addEventListener('pointerdown',hit);
hud();home();initDb();
</script>
</body>
</html>
